[package]
name = "ziewer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
comrak = { version = "0.59.0", features = ["syntect"] }
dotenvy = "0.15"
http = "1"
ipnet = { version = "2", features = ["serde"] }
mime_guess = "2"
minijinja = "2"
percent-encoding = "2"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
service-manager = "0.7"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["set-header"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
